@switch (peran()) {
  @case ('superadmin') {
    <app-dashboard-superadmin></app-dashboard-superadmin>
  }
  @case ('admin') {
    <app-dashboard-admin></app-dashboard-admin>
  }
  @case ('pegawai') {
    <app-dashboard-pegawai></app-dashboard-pegawai>
  }
  @case ('pejabat_penatausahaan') {
    <app-dashboard-admin></app-dashboard-admin>
  }
  @case ('pimpinan') {
    <app-dashboard-superadmin></app-dashboard-superadmin>
  }
}
