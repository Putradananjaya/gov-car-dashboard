<div class="form-overlay" (click)="onCancel()">
  <div class="form-modal glass-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Serah Terima Kendaraan</h2>
      <button class="close-btn" (click)="onCancel()" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-grid">
        <div class="form-section full-width">
          <div class="form-row">
            <div class="form-group" [class.has-error]="isInvalid('odometerKeluar')">
              <label for="odometerKeluar">Odometer Saat Diserahkan (km) *</label>
              <input type="number" id="odometerKeluar" formControlName="odometerKeluar" min="0" placeholder="Contoh: 45230">
              @if (isInvalid('odometerKeluar')) {
                <span class="error-msg">Wajib diisi, angka tidak boleh negatif</span>
              }
            </div>
            <div class="form-group" [class.has-error]="isInvalid('bbmKeluar')">
              <label for="bbmKeluar">Level BBM Saat Diserahkan (%) *</label>
              <input type="number" id="bbmKeluar" formControlName="bbmKeluar" min="0" max="100" placeholder="0-100">
              @if (isInvalid('bbmKeluar')) {
                <span class="error-msg">Wajib diisi, antara 0-100</span>
              }
            </div>
          </div>

          <div class="form-group" [class.has-error]="isInvalid('kondisiKeluar')">
            <label for="kondisiKeluar">Kondisi Kendaraan Saat Diserahkan *</label>
            <select id="kondisiKeluar" formControlName="kondisiKeluar">
              @for (opt of kondisiOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="catatanKondisiKeluar">Catatan Kondisi (opsional)</label>
            <textarea id="catatanKondisiKeluar" formControlName="catatanKondisiKeluar" rows="2" placeholder="Catatan tambahan kondisi kendaraan"></textarea>
          </div>

          <label class="form-checkbox-row" [class.has-error]="isInvalid('kunciDiserahkan')">
            <input type="checkbox" formControlName="kunciDiserahkan">
            Kunci kendaraan telah diserahkan kepada pemohon
          </label>
          @if (isInvalid('kunciDiserahkan')) {
            <span class="error-msg">Konfirmasi serah terima kunci wajib dicentang</span>
          }

          @if (saveError()) {
            <span class="error-msg">{{ saveError() }}</span>
          }
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Batal</button>
        <button type="submit" class="btn-primary" [disabled]="isSaving()">
          {{ isSaving() ? 'Menyimpan...' : 'Konfirmasi Serah Terima' }}
        </button>
      </div>
    </form>
  </div>
</div>
