<div class="form-overlay" (click)="onCancel()">
  <div class="form-modal glass-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Pengembalian Kendaraan</h2>
      <button class="close-btn" (click)="onCancel()" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-grid">
        <div class="form-section full-width">
          <div class="form-row">
            <div class="form-group" [class.has-error]="isInvalid('odometerMasuk')">
              <label for="odometerMasuk">Odometer Saat Dikembalikan (km) *</label>
              <input type="number" id="odometerMasuk" formControlName="odometerMasuk" min="0" placeholder="Contoh: 45480">
              @if (isInvalid('odometerMasuk')) {
                <span class="error-msg">Wajib diisi, angka tidak boleh negatif</span>
              }
            </div>
            <div class="form-group" [class.has-error]="isInvalid('bbmMasuk')">
              <label for="bbmMasuk">Level BBM Saat Dikembalikan (%) *</label>
              <input type="number" id="bbmMasuk" formControlName="bbmMasuk" min="0" max="100" placeholder="0-100">
              @if (isInvalid('bbmMasuk')) {
                <span class="error-msg">Wajib diisi, antara 0-100</span>
              }
            </div>
          </div>

          <div class="form-group" [class.has-error]="isInvalid('kondisiMasuk')">
            <label for="kondisiMasuk">Kondisi Kendaraan Saat Dikembalikan *</label>
            <select id="kondisiMasuk" formControlName="kondisiMasuk">
              @for (opt of kondisiOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="catatanKondisiMasuk">Catatan Kondisi (opsional)</label>
            <textarea id="catatanKondisiMasuk" formControlName="catatanKondisiMasuk" rows="2" placeholder="Catatan tambahan kondisi kendaraan"></textarea>
          </div>

          <label class="form-checkbox-row" [class.has-error]="isInvalid('kunciDikembalikan')">
            <input type="checkbox" formControlName="kunciDikembalikan">
            Kunci kendaraan telah dikembalikan
          </label>
          @if (isInvalid('kunciDikembalikan')) {
            <span class="error-msg">Konfirmasi pengembalian kunci wajib dicentang</span>
          }

          @if (saveError()) {
            <span class="error-msg">{{ saveError() }}</span>
          }
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Batal</button>
        <button type="submit" class="btn-primary" [disabled]="isSaving()">
          {{ isSaving() ? 'Menyimpan...' : 'Konfirmasi Pengembalian' }}
        </button>
      </div>
    </form>
  </div>
</div>
